apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config-merge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nvcaop.labels" . | nindent 4 }}
data:
  config.yaml: |
{{ $mergeConfig | toYaml | indent 4 }}
{{- end }}
