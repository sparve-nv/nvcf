{{- $mergeConfig := dict -}}
{{- if (.Values.agentConfig).mergeConfig }}
{{- $mergeConfig = .Values.agentConfig.mergeConfig | fromYaml | default dict -}}
{{- end }}
{{- $agentValues := .Values.agent | default dict -}}
{{- $byooOtelCollector := get $agentValues "byooOtelCollector" | default dict -}}
{{- if $byooOtelCollector }}
{{- $agentConfig := get $mergeConfig "agent" | default dict -}}
{{- $_ := set $agentConfig "byooOtelCollector" $byooOtelCollector -}}
{{- $_ := set $mergeConfig "agent" $agentConfig -}}
{{- end }}
{{- if $mergeConfig }}
